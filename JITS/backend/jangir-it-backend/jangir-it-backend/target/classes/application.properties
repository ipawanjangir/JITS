spring.application.name=jangir-it-backend

# ==========================
# DATABASE CONFIGURATION
# ==========================
# SECURITY NOTE: Password ab yahan directly nahi hai.
# ${DB_USERNAME:root} ka matlab hai: "DB_USERNAME naam ka environment
# variable use karo, agar wo set nahi hai toh default 'root' use kar lo."
# Isse local development mein bina extra setup ke bhi kaam chalega,
# aur production mein sirf environment variable set karke real
# password inject kar sakte ho — file mein kabhi likhna nahi padega.

spring.datasource.url=jdbc:mysql://localhost:3306/jangir_it_db

spring.datasource.username=root

spring.datasource.password=N_jangir@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================
# JPA CONFIGURATION
# ==========================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# ==========================
# CORS CONFIGURATION
# ==========================
# Yahan par bata do frontend kaun se URL se chal raha hai.
# Local testing ke liye Live Server ka default port 5500 use hota hai;
# jab real domain mil jaye (jaise https://jangiritsolution.com),
# usko yahan daal dena — CorsConfig.java isi property ko padhta hai.

app.cors.allowed-origin=http://127.0.0.1:5500

# ==========================
# JWT (LOGIN TOKEN) CONFIGURATION
# ==========================
# app.jwt.secret: token sign/verify karne ki secret key. Isse
# environment variable mein rakhna best hota hai (jaise DB password),
# lekin abhi ke liye ek pehle-se-generated safe default diya hai
# taaki turant test kar sako. Production mein isko JWT_SECRET
# environment variable se override kar dena.
app.jwt.secret=${JWT_SECRET:DJJdqwpCDlefIHCI1SPTlpvKFucW4uzLsWCllH+xC4I=}

# Token kitni der valid rahega (milliseconds mein).
# 86400000 ms = 24 ghante — matlab admin ko din mein ek baar login
# karna padega, uske baad token expire ho jayega.
app.jwt.expiration-ms=86400000